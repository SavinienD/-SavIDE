[package]
name = "axecode-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Background session service for SavIDE: owns sessions, journals and recoverable workers"
default-run = "axecode-daemon"

[lib]
name = "axecode_daemon"
path = "src/lib.rs"

[[bin]]
name = "axecode-daemon"
path = "src/main.rs"

[dependencies]
axecode-core = { workspace = true }
portable-pty = "0.9.0" # v2-l3: terminal in the service
axecode-app = { workspace = true } # v2-l2: confined workspace filesystem helpers
axecode-harness = { workspace = true } # v2-l2.4: harness (brain) RPC in the service
axecode-agents = { workspace = true } # v2-l7c: external agents RPC
reqwest = { workspace = true } # axe:voix: whisper.cpp server of the machine

anyhow = { workspace = true }
argon2 = { workspace = true } # axe:remote
httparse = "1" # axe:remote
rust-embed = { version = "8", features = ["debug-embed"] } # axe:webui
rand = { workspace = true } # axe:remote
sha2 = { workspace = true } # axe:remote
tokio-tungstenite = { workspace = true } # axe:remote
async-trait = { workspace = true }
base64 = { workspace = true }
directories = { workspace = true }
flate2 = { workspace = true } # axe:menage: archives older than 7 days are compressed
futures-util = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
uuid = { workspace = true }

