[package]
name = "axecode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SavIDE — AI agent IDE (desktop app)"
default-run = "axecode"

[lib]
name = "axecode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
directories = { workspace = true } # providers
async-trait = { workspace = true } # providers
axecode-anthropic = { workspace = true }
axecode-app = { workspace = true }
axecode-core = { workspace = true }
axecode-google = { workspace = true }
axecode-kimi = { workspace = true }
axecode-openai = { workspace = true }
axecode-openrouter = { workspace = true }
axecode-harness = { workspace = true } # harness
axecode-daemon = { workspace = true } # daemon
axecode-repl = { workspace = true } # daemon
axecode-gemini-web = { workspace = true } # gemini-web

anyhow = { workspace = true }
base64 = { workspace = true }
notify = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
rusqlite = { workspace = true } # viewers
zip = { workspace = true } # viewers
ring = { workspace = true }
portable-pty = "0.9.0"
reqwest = { workspace = true }
whisper-rs = "0.16" # micro-local
sha2 = { workspace = true } # micro-local

# événement ProcessFailed de WebView2 (mêmes versions que wry).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
# Toasts de Windows (crate déjà présente via wry, même version ; fonctions en plus).
windows = { version = "0.61", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

# Updater plugin is desktop-only (Tauri does not ship updater for iOS/Android).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { workspace = true }
semver = "1"

[lints]
workspace = true
