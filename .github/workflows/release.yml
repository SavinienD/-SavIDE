name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      CUA_URL: https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.38.0/cua-driver-rs-0.38.0-windows-x86_64-binary.zip
      CUA_SHA256: 5edaa74d0afa1b55a9668dbc4f32736507bd2bd4d75b18ca1dc8881bb12402b5
    steps:
      - name: Dossier temporaire sur le disque de travail (EXDEV)
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Version du tag = version de l'appli
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"; $v = $tag.TrimStart('v')
          $app = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($app -ne $v) { throw "Tag $tag mais tauri.conf.json = $app" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: cua-driver (release officielle, SHA256 vérifié)
        shell: pwsh
        run: |
          Invoke-WebRequest $env:CUA_URL -OutFile cua.zip
          $h = (Get-FileHash cua.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:CUA_SHA256) { throw "SHA256 cua-driver inattendu : $h" }
          Expand-Archive cua.zip -DestinationPath cua-x
          New-Item -ItemType Directory -Force src-tauri/binaries/cua-driver | Out-Null
          Copy-Item cua-x/*.exe src-tauri/binaries/cua-driver/
          Remove-Item cua.zip, cua-x -Recurse -Force

      - run: npm ci --no-audit --no-fund

      - name: tauri build (NSIS signé)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis --config src-tauri/tauri.sidecars.conf.json --config src-tauri/tauri.build-local.json

      - name: latest.json
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path target, src-tauri/target -Recurse -Filter *-setup.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "bundle[\\/]nsis" } | Select-Object -First 1
          if (-not $exe) { throw "installeur NSIS introuvable" }
          $dir = $exe.DirectoryName
          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path $sig)) { throw "signature absente : $sig" }
          $name = $exe.Name -replace ' ', '.'
          if ($name -ne $exe.Name) { Rename-Item $exe.FullName $name; Rename-Item $sig "$name.sig" }
          $tag = "${{ github.ref_name }}"
          $obj = [ordered]@{
            version = $env:VERSION
            notes = "SavIDE $tag"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = [ordered]@{
              signature = (Get-Content "$dir/$name.sig" -Raw).Trim()
              url = "https://github.com/${{ github.repository }}/releases/download/$tag/$name" } }
          }
          $obj | ConvertTo-Json -Depth 5 | Set-Content "$dir/latest.json" -Encoding utf8NoBOM
          "ASSET_DIR=$dir" >> $env:GITHUB_ENV
          "ASSET_EXE=$name" >> $env:GITHUB_ENV

      - name: Release GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $d = $env:ASSET_DIR
          gh release create "${{ github.ref_name }}" "$d/$env:ASSET_EXE" "$d/$env:ASSET_EXE.sig" "$d/latest.json" --repo "${{ github.repository }}" --title "SavIDE ${{ github.ref_name }}" --generate-notes
